name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SeatGuard.slnx

      - name: Verify formatting
        run: dotnet format SeatGuard.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SeatGuard.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test SeatGuard.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=tests.trx"
          --blame-hang-timeout 5m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render overlays
        run: |
          cp deploy/k8s/overlays/prod/secrets.env.example deploy/k8s/overlays/prod/secrets.env
          kubectl kustomize deploy/k8s/overlays/dev > /tmp/dev.yaml
          kubectl kustomize deploy/k8s/overlays/prod > /tmp/prod.yaml

      - name: Validate with kubeconform
        run: |
          docker run --rm -v /tmp:/manifests ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -ignore-missing-schemas /manifests/dev.yaml /manifests/prod.yaml

  container:
    name: Build, smoke-test, scan and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-test

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: seatguard
          POSTGRES_USER: seatguard
          POSTGRES_PASSWORD: seatguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatguard -d seatguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/seatguard-api
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build exactly one artifact. Pull requests keep it in the local daemon;
      # branch/tag pushes send it to GHCR and the remaining steps verify the
      # pushed digest, so the scanned and smoke-tested bytes are the published
      # bytes instead of a second build.
      - name: Build image once
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/SeatGuard.Api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags || 'seatguard-api:ci' }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name == 'push' }}
          sbom: ${{ github.event_name == 'push' }}

      - name: Resolve image reference
        id: image
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ref=ghcr.io/${{ github.repository_owner }}/seatguard-api@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=seatguard-api:ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull the pushed digest
        if: github.event_name == 'push'
        run: docker pull "${{ steps.image.outputs.ref }}"

      - name: Smoke-test migrations, readiness and UI
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          connection="Host=host.docker.internal;Port=5432;Database=seatguard;Username=seatguard;Password=seatguard"

          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e ConnectionStrings__SeatGuard="$connection" \
            -e Admin__ApiKey=ci-admin-key \
            -e Observability__Enabled=false \
            "$IMAGE" --migrate

          docker run --detach --name seatguard-smoke \
            --add-host=host.docker.internal:host-gateway \
            --publish 18080:8080 \
            -e ASPNETCORE_URLS=http://+:8080 \
            -e ConnectionStrings__SeatGuard="$connection" \
            -e Admin__ApiKey=ci-admin-key \
            -e Observability__Enabled=false \
            "$IMAGE"

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready > /tmp/ready.json; then
              break
            fi
            sleep 1
          done

          cat /tmp/ready.json
          grep --quiet '"status":"Healthy"' /tmp/ready.json
          curl --fail --silent http://127.0.0.1:18080/ui/ | grep --quiet "Booking console"

      - name: Dump container logs
        if: always()
        run: docker logs seatguard-smoke || true

      - name: Remove smoke container
        if: always()
        run: docker rm --force seatguard-smoke || true

      - name: Scan the tested image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
