apiVersion: v1
kind: ServiceAccount
metadata:
  name: seatguard-api
  labels:
    app.kubernetes.io/name: seatguard-api
    app.kubernetes.io/part-of: seatguard
automountServiceAccountToken: false
# Both the migration Job and the API Deployment run as this account, so they
# inherit the pull credentials for a private GHCR package. Create the secret in
# the target namespace before applying the overlay (see deploy/k8s/README.md).
imagePullSecrets:
  - name: ghcr-pull
