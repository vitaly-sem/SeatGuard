apiVersion: batch/v1
kind: Job
metadata:
  name: seatguard-migrate
  labels:
    app.kubernetes.io/name: seatguard-migrate
    app.kubernetes.io/part-of: seatguard
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seatguard-migrate
        app.kubernetes.io/part-of: seatguard
    spec:
      restartPolicy: OnFailure
      serviceAccountName: seatguard-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: seatguard-api:latest
          imagePullPolicy: IfNotPresent
          command: ["dotnet", "SeatGuard.Api.dll", "--migrate"]
          envFrom:
            - configMapRef:
                name: seatguard-config
            - secretRef:
                name: seatguard-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
