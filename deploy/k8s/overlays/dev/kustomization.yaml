apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: seatguard-dev

resources:
  - namespace.yaml
  - ../../base
  - postgres.yaml

patches:
  - path: patch-configmap.yaml
  - path: patch-deployment.yaml
  - path: patch-serviceaccount.yaml
  - path: patch-pdb.yaml

secretGenerator:
  - name: seatguard-secrets
    literals:
      - ConnectionStrings__SeatGuard=Host=seatguard-postgres;Port=5432;Database=seatguard;Username=seatguard;Password=seatguard;Gss Encryption Mode=Disable
      - Admin__ApiKey=dev-admin-key
  - name: seatguard-postgres
    literals:
      - POSTGRES_DB=seatguard
      - POSTGRES_USER=seatguard
      - POSTGRES_PASSWORD=seatguard

# Keep the generated name suffix: rotating a secret changes the pod template
# and therefore rolls the Deployment instead of leaving pods on old values.
