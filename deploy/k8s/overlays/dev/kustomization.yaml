apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: seatguard-dev

resources:
  - namespace.yaml
  - ../../base
  - postgres.yaml

patches:
  - path: patch-configmap.yaml
  - path: patch-deployment.yaml

secretGenerator:
  - name: seatguard-secrets
    literals:
      - ConnectionStrings__SeatGuard=Host=seatguard-postgres;Port=5432;Database=seatguard;Username=seatguard;Password=seatguard
      - Admin__ApiKey=dev-admin-key
  - name: seatguard-postgres
    literals:
      - POSTGRES_DB=seatguard
      - POSTGRES_USER=seatguard
      - POSTGRES_PASSWORD=seatguard

generatorOptions:
  disableNameSuffixHash: true
