apiVersion: v1
kind: Service
metadata:
  name: seatguard-postgres
  labels:
    app.kubernetes.io/name: seatguard-postgres
    app.kubernetes.io/part-of: seatguard
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: seatguard-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seatguard-postgres
  labels:
    app.kubernetes.io/name: seatguard-postgres
    app.kubernetes.io/part-of: seatguard
spec:
  serviceName: seatguard-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seatguard-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seatguard-postgres
        app.kubernetes.io/part-of: seatguard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: seatguard-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "seatguard", "-d", "seatguard"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "seatguard", "-d", "seatguard"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
