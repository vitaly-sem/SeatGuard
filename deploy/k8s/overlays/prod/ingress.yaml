apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seatguard-api
  labels:
    app.kubernetes.io/name: seatguard-api
    app.kubernetes.io/part-of: seatguard
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - seatguard.example.com
      secretName: seatguard-tls
  rules:
    - host: seatguard.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seatguard-api
                port:
                  name: http
