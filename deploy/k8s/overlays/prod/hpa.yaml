apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: seatguard-api
  labels:
    app.kubernetes.io/name: seatguard-api
    app.kubernetes.io/part-of: seatguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: seatguard-api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
