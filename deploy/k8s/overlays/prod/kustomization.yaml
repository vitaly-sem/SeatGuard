apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: seatguard

resources:
  - namespace.yaml
  - ../../base
  - ../../monitoring
  - hpa.yaml
  - ingress.yaml

patches:
  - path: patch-configmap.yaml
  - path: patch-deployment.yaml

secretGenerator:
  - name: seatguard-secrets
    envs:
      - secrets.env

# Keep the generated name suffix: rotating a secret changes the pod template
# and therefore rolls the Deployment instead of leaving pods on old values.

images:
  - name: seatguard-api
    newName: ghcr.io/vitaly-sem/seatguard-api
    newTag: 1.0.0
